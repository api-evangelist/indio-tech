specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Indio Technologies
providerId: indio-tech
created: '2026-07-10'
modified: '2026-07-10'
reconciled: false
tags:
- Insurance
- Insurtech
- Submissions
- Plans
description: >-
  Indio is sold as a per-seat SaaS product for insurance agencies and brokers,
  not as a metered API. Public third-party listings report a starting price
  around $50 per user per month, with full agency pricing quoted by Indio /
  Applied Systems sales based on seat count and needs. There is no separate,
  publicly priced API plan - programmatic data exchange is handled through
  Applied Systems partner channels (Applied Epic integration/SDK and the IVANS
  data exchange) under partner agreements rather than a self-service API tier.
notes: >-
  The per-user starting price is drawn from public software directories and may
  be out of date; confirm current pricing with Indio / Applied Systems during
  reconciliation. No public API pricing, quotas, or overage rates are published.
sources:
- https://www.useindio.com
- https://www.capterra.com/p/178007/Indio/
- https://www.softwareadvice.com/insurance/indio-profile/
plans:
- id: indio-per-user
  name: Indio Platform (Per User)
  type: paid
  description: >-
    Per-seat access to the Indio insurance application and submissions platform -
    the 10,000+ smart-form library, ACORD applications, submission workspaces,
    e-signature and secure document sharing. Public directories list a starting
    price around $50 per user per month; actual agency pricing is quoted by
    sales.
  entries:
  - label: Per User Seat
    name: per_user_seat
    type: flat
    metric: seat
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: from ~$50 per user per month (starting price; contact sales for agency quote)
    userMultiplied: true
  elements:
  - name: Smart Form Library (10,000+)
  - name: ACORD Applications
  - name: Submission Workspaces
  - name: E-Signature
  - name: Secure Document Sharing
- id: indio-agency-enterprise
  name: Agency / Enterprise
  type: enterprise
  description: >-
    Custom agency-wide licensing, Applied Epic and IVANS integration, partner
    data exchange, and volume terms. Priced by Indio / Applied Systems sales.
  entries:
  - label: Agency Agreement
    name: agency_agreement
    type: flat
    metric: contract
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Applied Epic Integration
  - name: IVANS Data Exchange
  - name: Volume Seat Pricing
  - name: Partner Support
maintainers:
