  humanURL: https://help.useindio.com/en/
  endpointsModeled: true
  properties:
  - url: https://help.useindio.com/en/
    type: Documentation
  description: >-
    Logical grouping (modeled, not publicly documented) for Indio's
    document-upload requests, secure document sharing and full e-signature
    solution that ride inside a submission. These are product features exposed
    in the Indio portal; no public developer endpoints are documented for
    initiating uploads or e-signature requests programmatically.
