apis:
- aid: indio-tech:indio-tech-submissions-api
  name: Indio Submissions API
  tags:
  - Submissions
  - Renewals
  - Commercial Insurance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.useindio.com/en/collections/2173888-submission-features
  endpointsModeled: true
  properties:
  - url: https://help.useindio.com/en/collections/2173888-submission-features
    type: Documentation
  - url: https://devcenter.myappliedproducts.com/home
    type: DeveloperProgram
  description: >-
    Logical grouping (modeled, not publicly documented) for Indio's core
    submission object - the workspace that packages digital applications,
    schedule workbooks, document-upload requests and e-signature requests for a
    single insured. In the product, submissions are created, populated, sent to
    insureds, renewed, and submitted to carriers. Programmatic access to this
    data is partner-gated through Applied Systems (Applied Epic integration and
    the IVANS data exchange), not a documented public REST API.
- aid: indio-tech:indio-tech-forms-applications-api
  name: Indio Forms and Applications API
  tags:
  - Forms
  - Applications
  - ACORD
  - Smart Forms
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.useindio.com/en/articles/2143244-how-to-add-and-select-forms
  endpointsModeled: true
  properties:
  - url: https://help.useindio.com/en/articles/2143244-how-to-add-and-select-forms
    type: Documentation
  description: >-
    Logical grouping (modeled, not publicly documented) for Indio's library of
    10,000+ digitally enhanced "smart" insurance forms and ACORD applications
    that can be added to a submission, auto-mapped, pre-filled from prior data,
    and completed and signed electronically by insureds. There is no documented
    public endpoint set for selecting, adding, or reading form data - these
    capabilities are surfaced through the Indio UI and partner integrations.
- aid: indio-tech:indio-tech-clients-api
