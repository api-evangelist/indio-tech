aid: indio-tech
url: https://raw.githubusercontent.com/api-evangelist/indio-tech/refs/heads/main/apis.yml
name: Indio Technologies
kind: company
description: >-
  Indio Technologies is a cloud-based insurance application and submissions
  platform for commercial insurance agencies and brokers, acquired by and now
  part of Applied Systems. Indio replaces manual PDF forms and spreadsheets with
  a library of 10,000+ digitally enhanced "smart" insurance forms and ACORD
  applications, a submission workspace that packages digital applications,
  schedule workbooks, document-upload requests and e-signature requests, plus
  secure document sharing. Indio does not publish a self-service public developer
  API. Programmatic access is partner/carrier-gated and delivered through Applied
  Systems - the Applied Epic bi-directional integration and SDK, the IVANS data
  exchange API (used to move submission and proposal data between agencies,
  brokers and carriers), and the Applied DevCenter partner developer program.
  The API surfaces below are modeled from Indio's documented product concepts
  (submissions, forms/applications, clients, documents and e-signatures); they
  are logical groupings, not publicly documented endpoints (endpointsModeled).
