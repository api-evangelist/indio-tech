  humanURL: https://help.useindio.com/en/
  endpointsModeled: true
  properties:
  - url: https://help.useindio.com/en/
    type: Documentation
  - url: https://help.appliedsystems.com/Help/EpicSDK/2021.2/html/8292f241-9ab2-43f7-ab2f-25fc3843128b.htm
    type: SDK
  description: >-
    Logical grouping (modeled, not publicly documented) for the client/insured
    records a submission is created against. Client data is synchronized
    bi-directionally with the Applied Epic agency management system and with
    Policy Works via Applied Systems integrations rather than an open Indio REST
    API. The closest documented programmatic surface is the Applied Epic SDK,
    which reads and writes agency data used to populate Indio.
- aid: indio-tech:indio-tech-documents-esignature-api
